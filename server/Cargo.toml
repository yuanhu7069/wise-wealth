[package]
name = "wise-wealth-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-native-tls", "postgres", "migrate", "uuid", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.21", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["serde", "v7"] }
tower-http = { version = "0.6", features = ["trace", "set-header"] }
toml = "1.1.5"
argon2 = "0.5"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
