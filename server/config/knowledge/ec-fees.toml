# 知识库 · 理财百科(G 期 FEATURE-004)
id = "ec-fees"
kind = "encyclopedia"
title = "费率"
summary = "投资里最确定的成本:管理费、托管费、申赎费……每一分费率都在确定性侵蚀收益。"

[[sections]]
heading = "是什么"
paragraphs = [
  "费率是投资过程中被各类机构收取的成本总和,常见有:管理费(按资产规模每年计提)、托管费、申购赎回费、销售服务费等。它们多数按日计提、藏在净值里,不显眼但持续。",
]

[[sections]]
heading = "为什么重要"
paragraphs = [
  "收益是不确定的,费用是确定的:同样是持有一只基金,费率每年差一个百分点,二十年下来就是一笔可观的差额。长期投资者对费率的敏感度,应该远高于对短期收益排名的敏感度。",
  "判断费率高低要看类别:被动指数类产品费率整体低于主动管理类;同类内部再比较,才有意义。",
]

[[sections]]
heading = "与本产品的关系"
paragraphs = [
  "本产品只到大类资产配置,不涉及任何具体产品,因此不替你比较费率。但请记住:把模式给的比例落地到具体品种时,费率是你在「比例之外」能自己控制的最重要的变量。",
]
