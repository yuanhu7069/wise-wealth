# 知识库 · 不可落地专区(RULE-040:仅供理解,不建议照搬)
id = "ni-yale-model"
kind = "non_implementable"
title = "耶鲁模式:大学捐赠基金的资产配置圣杯"
summary = "机构资金的传奇配置法,年化成绩斐然——但它的每一根支柱,个人投资者都搬不动。"

[[sections]]
heading = "它说什么"
paragraphs = [
  "耶鲁模式指美国耶鲁大学捐赠基金在其首席投资官主持下形成的配置体系:大幅超配私募股权、对冲基金、房地产、自然资源等另类资产,传统股票债券占比很低;配合严格的再平衡纪律与超长期限的资金属性,数十年间取得了机构界的顶级年化成绩。",
  "它的核心洞察是:流动性是有代价的,愿意放弃流动性的人可以获得流动性溢价;同时分散到相关性低的资产,能让整体组合更稳。",
]

[[sections]]
heading = "为什么它值得学习"
paragraphs = [
  "「分散到不相关的资产」「用长期资金换流动性溢价」「纪律化再平衡」——这三条思想对任何投资者都成立,也正是本产品大类配置与应急金先行的思想底座。",
]

[[sections]]
heading = "为什么不建议照搬"
paragraphs = [
  "另类资产对个人完全不可及:顶级私募股权与对冲基金不对个人开放,准入门槛以百万计且要求机构资质;个人能接触到的「类耶鲁」品种,往往是费率与风险都走样的包装物。",
  "资金属性不匹配:捐赠基金的负债几乎无限期,可以在十年不动用的情况下穿越周期;个人的钱有明确的久期与生活用途,深度另类资产的长期锁定期会随时制造流动性事故。",
  "它的管理资源不可复制:耶鲁模式背后是一个专职团队对每个合作管理人的深度尽调与谈判能力——这是资金规模换来的组织能力,不是一张配置表。结论:学它的思想(分散、长期、纪律),放下它的工具箱。",
]
