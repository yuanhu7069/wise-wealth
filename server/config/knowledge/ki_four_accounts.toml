# 知识库 · 模式解读(RULE-039:局限性必须写)
id = "ki-four_accounts"
kind = "mode_interpretation"
title = "四账户理财法:把工资切进四本存折"
related_mode = "four_accounts"
summary = "韩国银行职员的方法:先扣死大额固定支出,再按比例给消费,应急与投资排在后面排队。"

[[sections]]
heading = "理论来源"
paragraphs = [
  "四账户理财法出自韩国理财作家高敬镐的《膨胀吧,钱包君》(韩文原版书名直译为「四本存折」),中文版先后以「四本存折系统」「4 个定制账户」之名出版。作者长期在银行一线工作,方法面向的是月薪族「钱一发就花光」的普遍困境。",
  "它的核心动作只有一个:发薪日先把工资分别划进四个用途不同的账户,让「要花的钱」和「要存的钱」物理分开。账户是手段,纪律才是目的。",
]

[[sections]]
heading = "核心逻辑"
paragraphs = [
  "第一本是大额固定支出账户:房租、房贷、水电这类每月必然发生的钱,发薪当天全额扣走,保证生活底盘不塌。第二本是消费账户:按税后收入的一个固定比例(书中示例为三成)划入,日常吃穿行都从这里出,花完即止。",
  "第三本是备用账户:按应急金目标排一个每月转入节奏,攒够目标后自动停转,省下的份额流进第四本投资账户。这种「达标即停」的设计让应急与投资共用一条水管,不会永远攒应急金。",
  "四个账户按「固定支出 → 比例消费 → 应急节奏 → 投资余量」的顺序求解,前面的账户拿不满时,后面的依次让位——先保生活,再谈增值。",
]

[[sections]]
heading = "适用条件"
paragraphs = [
  "适合月收入规律到账、固定支出占比清晰、且「存不下钱」主要原因是随手花的人:物理分账把克制变成了自动动作。",
  "也适合理财起步阶段:四个账户各管一件事,出了问题能立刻定位是哪一本超支。",
]

[[sections]]
heading = "局限性"
paragraphs = [
  "它对「花多少」没有优化能力:消费账户按比例划入,如果这个比例本身定高了,系统只是精确地执行一个偏高的预算,不会提醒你调低。",
  "固定支出占比过高的家庭(如房贷压顶)会让后两个账户长期接近零,方法这时候只能保证不逾期,谈不上积累;需要先动支出结构,而不是换分账法。",
  "四本存折的账户管理本身有 maintenance 成本:账户太多的人执行几个月后容易懈怠,纪律性退化后方法就名存实亡。",
]
