# 知识库 · 理财百科(G 期 FEATURE-004)
id = "ec-drawdown"
kind = "encyclopedia"
title = "回撤"
summary = "从高点跌下来的幅度:所有长期收益都要先经过它,扛不住回撤就吃不到复利。"

[[sections]]
heading = "是什么"
paragraphs = [
  "回撤指资产从历史高点下跌的幅度:从 100 跌到 70,回撤就是三成。它是描述「过程有多难受」的指标——终点收益再好,中间的回撤是持有者真实经历过的痛苦。",
]

[[sections]]
heading = "为什么重要"
paragraphs = [
  "回撤的数学特性对纪律要求极高:跌三成需要涨约四成三才能回本,跌五成需要涨一倍。回撤越深,「拿住不动」的难度呈指数上升——多数长期计划的失败,都发生在深度回撤里的某一次割肉。",
  "能承受多大回撤,主要取决于两件事:这笔钱多久后要用(久期越长越扛得住),以及下跌发生时你的真实反应(行为事实,而非自我评估)。这也是「先应急、后投资」的原因:应急金在,回撤才不威胁生活。",
]

[[sections]]
heading = "与本产品的关系"
paragraphs = [
  "本产品的问卷用「一百万跌到七十万你的第一反应」来测你的回撤反应,并以此决定投资配置的上限——测的是行为,不是愿望。追踪页的偏离提醒,也是在帮你在真实回撤里区分「市场波动」和「自己跑偏」。",
]
