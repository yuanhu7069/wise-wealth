# 知识库 · 理财百科(G 期 FEATURE-004)
id = "ec-compounding"
kind = "encyclopedia"
title = "复利"
summary = "收益产生收益:时间越长越惊人,但前提是本金不中断、不折损。"

[[sections]]
heading = "是什么"
paragraphs = [
  "复利指收益并入本金继续产生收益:第一年的收益第二年也开始生息,增长是指数曲线而非直线。「利滚利」说的就是它。",
]

[[sections]]
heading = "为什么重要"
paragraphs = [
  "复利的威力完全依赖时间:同样的年化水平,坚持二十年与坚持五年的差距远超四倍。这也是为什么理财的常见建议都强调「尽早开始」——开始得晚,最大的损失不是本金,是时间。",
  "复利有两个隐形前提:过程中不能中断(被迫中途取出会打断滚动),本金不能大幅折损(一次深度亏损需要多年才能填平)。这两点恰恰是应急金与资产配置要解决的问题。",
]

[[sections]]
heading = "与本产品的关系"
paragraphs = [
  "本产品不承诺任何收益率,但方案的结构设计服务于复利的两个前提:应急金先立(不被迫中断),大类配置分散(避免单点折损)。剩下的时间变量,只属于能坚持的人。",
]
