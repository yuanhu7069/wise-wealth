# 知识库 · 模式解读(RULE-039:局限性必须写)
id = "ki-four-pots"
kind = "mode_interpretation"
title = "四笔钱:按「这笔钱多久后要用」分流"
related_mode = "four_pots"
summary = "国内基金投顾平台产品化的框架:不看比例看久期,每一笔钱按用途和用钱时间各归各的池子。"

[[sections]]
heading = "理论来源"
paragraphs = [
  "四笔钱是国内基金投顾平台盈米且慢对「资金规划」的通俗化表述,把家庭可投资金按用途与久期分为四类:活钱管理、保险保障、稳健理财、长期投资。它不是某本理财书的直接产物,而是一线投顾服务里反复打磨出来的分账口径。",
  "与舶来框架相比,它的语言体系更贴合国内语境:不预设信用卡周期,不预设退休账户制度,直接回答「这笔钱几年后要用」这个普通人答得上来的问题。",
]

[[sections]]
heading = "核心逻辑"
paragraphs = [
  "分流的关键变量是久期:几个月内要用的进活钱,应对突发与保障的进保障池,两三年内要用的进稳钱,五年以上不动的进长钱。久期决定这笔钱能承受多大波动,进而决定它该放什么。",
  "在本产品的实现里,四笔钱被表达为:活钱按每月固定开销足额扣划(要花的钱先落袋);保障池按应急金目标排节奏,达标即停;稳钱按固定比例转入;长钱吃下全部余量并作为投资配置的作用点。",
  "它和四账户的形状几乎相同,差异在口径:四笔钱的「保障」把应急金与保障储备合在一池,且整体按资金久期叙事——你花的每一笔钱都有一个「多久后要用」的标签。",
]

[[sections]]
heading = "适用条件"
paragraphs = [
  "适合已经有明确储蓄目标、能大致说出「这笔钱几年后要用」的人;久期一旦说得清,每一池的去处就不再纠结。",
  "也适合被复杂预算表劝退过的人:四个池子按用途命名,比按比例命名更容易长期坚持。",
]

[[sections]]
heading = "局限性"
paragraphs = [
  "框架本身不规定各池比例:稳钱占多少、长钱占多少,原典留给使用者自定,本产品以配置值呈现(可调)。比例随意味着它需要使用者对自己的情况有判断,新手可能反而无从下手。",
  "「保障」一池混合了应急金与保险储备两种性质的钱:应急金讲流动性,保险讲杠杆,混管容易在「这笔钱到底能不能动」上含糊。保费支出也不在分账框架内,需要并入日常开销另行管理。",
  "四笔钱与四账户在桶结构上高度相似,同时使用两个框架会造成管理冗余——选一个坚持比两个都摆着更有效。",
]
