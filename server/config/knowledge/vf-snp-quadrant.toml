# 知识库 · 出处考据(RULE-040:disputed 模式的深挖文章)
id = "vf-snp-quadrant"
kind = "verification"
title = "考据:「标准普尔家庭资产象限图」到底是谁画的"
summary = "流传十余年、讲座里讲了几万遍的四象限图,标准普尔公司从来没有发布过——一篇把来龙去脉讲清楚的考据。"

[[sections]]
heading = "这张图长什么样、在讲什么"
paragraphs = [
  "网传版本通常画成一个四象限方阵:要花的钱占 10%,保命的钱占 20%,生钱的钱占 30%,保本的钱占 40%,并声称这是「标准普尔公司调研全球十万个资产稳健增长的家庭后总结出的、最合理稳健的家庭资产分配方式」。",
  "图的用途从来不只是科普:它在国内大量出现在保险营销场景——「保命的钱要占两成,专款专用」,随后自然引向具体产品的推销。这是它传播力强、也让它值得被考据的直接原因。",
]

[[sections]]
heading = "证伪要点"
paragraphs = [
  "查无原始出处:标准普尔公司的公开出版物、研究报告与网站历史中,不存在任何名为「家庭资产象限图」或内容对应的报告;「全球十万个家庭」的样本描述无任何数据可考。若确有其事,以标普的行业地位,不可能没有可引用的原始文献。",
  "时间线吻合营销史:该图在中文互联网上可查的早期版本集中出现于 2011 年前后,载体是保险培训课件与博客转载,而非任何金融机构的研究发布。此后十余年,所有「引用」都是二手转述,没有一篇能给出第一手来源。",
  "比例本身经不起推敲:一个适用于「全球十万个家庭」的统一比例,竟不区分收入水平、人生阶段与所处国家的社保体系——真正的统计研究不可能得出这种一刀切结论。它的形态更接近营销话术对「分账思想」的简化包装,而非研究结论。",
]

[[sections]]
heading = "与已考证模式的差异"
paragraphs = [
  "对比之下,50/30/20 有明确出版物(Warren 家族的《All Your Worth》,2005),四账户有明确作者与版本沿革(高敬镐《膨胀吧,钱包君》),四笔钱有明确的国内方法论传承——它们的可信度评级都有实物支撑。",
  "标准普尔象限的「分账思想」本身并不错:用途分账、攻守分离,这些与经过考证的框架一致。问题出在权威性造假——用虚构的调研背书一个平庸的比例表,这正是它被标为「存疑」而非「错误」的原因:图未必害人,但出处一定有问题。",
]

[[sections]]
heading = "本产品的处理口径"
paragraphs = [
  "在模式库里,标准普尔象限被保留并标为存疑:它出现在模式列表、知识库与对比中,处处带辟谣说明;它不会出现在问卷推荐里,只能手动选择。",
  "收录它而不是删除它,是一个刻意的产品决定:中文互联网上流传最广的方法恰恰是它,与其假装不存在,不如把它放进有出处分级、有辟谣伴读的框架里讲清楚。这也是本产品「免费层告诉你怎么做」的诚信立场的一部分。",
]
