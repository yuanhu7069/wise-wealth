# 知识库 · 理财百科(G 期 FEATURE-004)
id = "ec-asset-classes"
kind = "encyclopedia"
title = "资产大类"
summary = "权益、债券、黄金、现金:风险与收益性格完全不同的几类资产,配置就是决定给每类多少。"

[[sections]]
heading = "是什么"
paragraphs = [
  "资产大类是按风险收益特征划分的资产集合:权益类(所有权,波动大、长期回报潜力高)、债券类(债权,波动小、回报有限)、黄金等商品类(无现金流、对冲属性)、现金类(流动性最高、几乎无波动)。每一大类内部有无数具体品种,但「性格」由大类决定。",
]

[[sections]]
heading = "为什么重要"
paragraphs = [
  "长期回报的主要来源是「各大类各占多少」的决定,而不是在大类里挑了哪个具体品种。大类之间的相关性低,组合在一起能让整体波动小于任何单一成分——这是「配置先于选品」的依据。",
  "大类没有绝对好坏:权益类在深度下跌时令人痛苦,现金类在长周期里跑输通胀。它们是工具,匹配久期与目的才分高下。",
]

[[sections]]
heading = "与本产品的关系"
paragraphs = [
  "本产品严格停留在资产大类层面:L2 配置只输出「权益多少、债券多少」这类比例,绝不指向任何具体产品。把比例落地成品种,是你自己的功课——这也是产品「不碰资金、只给建议」边界的一部分。",
]
