# 知识库 · 理财百科(G 期 FEATURE-004)
id = "ec-inflation"
kind = "encyclopedia"
title = "通胀"
summary = "钱随时间变「薄」:购买力被时间侵蚀,是「什么都不做」也要付出的成本。"

[[sections]]
heading = "是什么"
paragraphs = [
  "通胀指整体物价水平随时间上涨,同样一笔钱的购买力因此逐年下降。它不是某一次涨价,而是持续、普遍、温和(多数时候)的侵蚀。",
]

[[sections]]
heading = "为什么重要"
paragraphs = [
  "通胀让「本金安全」变成一个有歧义的概念:数字上没亏,购买力上可能已经亏了。纯现金储备越久,这种隐性损失越大——这是长期资金需要配置到能对抗通胀的资产类别上的根本理由。",
  "反过来,温和通胀也不是敌人:它是经济正常运转的一部分,资产配置的目标是长期购买力增长,而不是某一年账面数字的最大化。",
]

[[sections]]
heading = "与本产品的关系"
paragraphs = [
  "本产品各模式中「长期投资」类桶的存在理由,本质上就是让长期资金有机会跑赢通胀。应急金等短期资金则相反——它们的对手不是通胀,是突发风险,不必为跑赢通胀而承担波动。",
]
