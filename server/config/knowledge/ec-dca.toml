# 知识库 · 理财百科(G 期 FEATURE-004)
id = "ec-dca"
kind = "encyclopedia"
title = "定投"
summary = "固定时间、固定金额、机械执行:把「什么时候买」这个没人答得好的问题,变成不用答。"

[[sections]]
heading = "是什么"
paragraphs = [
  "定投(定期定额投资)指在固定时间以固定金额买入某类资产,不管当时价格高低。金额固定而非份额固定,价格低时自动买得多、价格高时买得少。",
]

[[sections]]
heading = "为什么重要"
paragraphs = [
  "定投解决的不是收益最大化,而是执行纪律:择时是连专业人士也做不好的事,定投把这个问题从你的生活里删除。它特别匹配「每月收入流」的现实——工资到账就分账,天然就是定投节奏。",
  "它也自动携带了「跌得越多买得越多」的机制,这是多数人情绪上做不到、机械上却能轻松完成的事。",
]

[[sections]]
heading = "与本产品的关系"
paragraphs = [
  "本产品的方案天然是月度节奏:每月收入按桶分配,投资桶按执行规则里的定投纪律落地。你不需要额外「开始定投」——按方案执行本身就是定投。",
]
