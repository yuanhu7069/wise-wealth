# 知识库 · 理财百科(G 期 FEATURE-004)
id = "ec-emergency-fund"
kind = "encyclopedia"
title = "应急金"
summary = "失业、生病、突发支出时的缓冲垫:金额按「必要月支出 × 月数」算,流动性比收益重要。"

[[sections]]
heading = "是什么"
paragraphs = [
  "应急金是专门应对突发状况(收入中断、医疗、紧急维修)的一笔专用资金。它的金额有明确算法:必要月支出乘以应急月数——月数由收入稳定性决定,越不稳定需要的月数越多,赡养负担也会上浮。",
]

[[sections]]
heading = "为什么重要"
paragraphs = [
  "应急金是所有长期投资的先决条件:没有它,任何市场波动都可能被迫在低点卖出长期资产变现。有了它,长期投资才真正「长期」得起来。",
  "它的存放原则是流动性与安全优先:随取随用、本金不波动,收益在这一池子里是最不重要的目标。",
]

[[sections]]
heading = "与本产品的关系"
paragraphs = [
  "本产品的每个 L1 模式都内置应急金规则:按你的收入稳定性与赡养人数算出目标月数,追踪页告诉你「还差几个月攒满」。攒满之前,模式会优先把资源导向应急桶——这就是「先保生活,再谈增值」的落地。",
]
