# 知识库 · 模式解读(RULE-039:局限性必须写)
id = "ki-snp-quadrant"
kind = "mode_interpretation"
title = "标准普尔象限:被讲了几万遍的「家庭资产配置图」"
related_mode = "snp_quadrant"
summary = "网传按 10/20/30/40 切分家庭资产的四象限图;流传极广,但出处站不住——本篇只讲它说了什么,不做背书。"

[[sections]]
heading = "理论来源"
paragraphs = [
  "网传的说法是:标准普尔公司(全球权威的指数编制与评级机构)调研了全球十万个资产稳健增长的家庭,分析他们的理财方式,得出这张「标准普尔家庭资产象限图」。图把家庭资产切成四块:要花的钱(10%)、保命的钱(20%)、生钱的钱(30%)、保本的钱(40%)。",
  "需要坦率说明的是:这一「调研」查无实据,标准普尔公司从未发布过此类报告。该图更可能成形于 2011 年前后的国内保险营销材料,随后经由理财课程与自媒体反复传播,成为中文互联网流传最广的资产配置图。这也是它在模式库里被标为「存疑」的全部原因。",
  "本篇按原典口径介绍它的结构,便于你看懂它在讲什么;这不构成对出处真实性的认可。",
]

[[sections]]
heading = "核心逻辑"
paragraphs = [
  "四个象限各有分工:要花的钱覆盖三到六个月日常开销;保命的钱名义上用于意外重疾保障,专款专用;生钱的钱投向权益等高收益高波动资产,目标增值;保本的钱投向低波动资产,守住本金。",
  "它的合理内核是「用途分账 + 攻守分离」:强制你意识到并非所有钱都该去博收益,也并非所有钱都该趴在活期。这一点与经过考证的分账法并无二致。",
  "在本产品的实现中,四个象限按 10/20/30/40 的静态比例切分税后收入,生钱的钱作为投资配置的作用点;要花的钱计入必要月支出,作为应急目标的基数。",
]

[[sections]]
heading = "局限性"
paragraphs = [
  "比例是硬伤:40% 保本、30% 生钱的固定切分完全不随人生阶段、收入结构与风险承受力变化——刚工作的人与临近退休的人拿到同一张图,这显然不合常理。",
  "「保命的钱」按收入两成常年划出,与实际保费规模严重脱钩;保险应以真实保费与保障缺口规划,而不是按一个传说比例拨款。本产品的实现将保命的钱作为静态比例桶处理,即承认了这一简化。",
  "两个投资方向(生钱、保本)只有一个能作为投资配置的作用点——本产品把配置落在生钱的钱上,保本的钱按静态比例搁置,这在本产品内是有意为之的保守处理。",
  "再次强调:它被收录是为了让「流传最广的方法」在产品里有据可查、有辟谣可读,不是因为它经过了验证。若你追求出处可靠的框架,四账户或四笔钱是更稳的选择。",
]
