# 知识库 · 不可落地专区(RULE-040:仅供理解,不建议照搬)
id = "ni-leveraged-lifecycle"
kind = "non_implementable"
title = "生命周期投资(杠杆版):年轻时加杠杆买股票的理论"
summary = "学术上颇有章法的「人力资本对冲」理论,但在国内的账户体系与成本结构下,个人照搬会先被工具卡死。"

[[sections]]
heading = "它说什么"
paragraphs = [
  "生命周期投资的杠杆版由两位美国学者提出,核心论证是:年轻人最大的资产是未来几十年的工资收入(人力资本),它近似于一只「债券」;为了让总资产(人力资本 + 金融资产)的权益暴露足够,年轻时应该在金融资产端加杠杆持有股票,随年龄增长再逐步去杠杆。",
  "理论的数学是自洽的:它甚至给出了「年轻时以两倍杠杆持有股票、随年龄线性降至正常水平」的具体路径。",
]

[[sections]]
heading = "为什么它有道理(在它的前提假设下)"
paragraphs = [
  "它戳中了传统建议的一个盲区:年轻时把绝大部分风险暴露押在「工资会不会失业」上,金融资产却保守得像退休者,一生整体的配置反而是扭曲的。承认人力资本的价值,是这个理论最有价值的地方。",
]

[[sections]]
heading = "为什么不建议照搬"
paragraphs = [
  "工具不存在:国内个人难以获得低成本的长期杠杆投资渠道,融资融券有高门槛与强平机制,消费贷等违规入市渠道则直接触碰合规红线。「用多少倍杠杆」在国内个人语境下经常是个无法合法回答的问题。",
  "前提假设在本地不成立:理论假设人力资本稳定(欠的债未来一定还得起),但国内青壮年面对的收入波动与行业变化并不比市场温和;杠杆放大的是资产波动,而你的工资端可能同时剧烈波动——两边一起出事时没有缓冲。",
  "强平机制会把「长期理论」打断成「短期事故」:下跌时被强制卖出,正是生命周期理论最需要你坚持的那个时点。结论:理解它,能帮你想明白「年轻时权益暴露不足」这个真问题;但答案在国内个人的工具箱里,不是加杠杆,而是把足够高的储蓄率投进权益。",
]
