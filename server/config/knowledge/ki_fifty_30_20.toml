# 知识库 · 模式解读(RULE-039:局限性必须写)
id = "ki-fifty_30_20"
kind = "mode_interpretation"
title = "50/30/20:一条线切开的预算框架"
related_mode = "fifty_30_20"
summary = "美国参议员沃伦合著的方法:必要开销、想要的开销、储蓄各占税后收入的一半、三成、两成。"

[[sections]]
heading = "理论来源"
paragraphs = [
  "50/30/20 出自 Elizabeth Warren 与女儿 Amelia Warren Tyagi 合著的《All Your Worth》(2005)。沃伦当时是研究美国家庭破产问题的学者,后来成为美国参议员;这本书的目标读者是「收入还行却总觉得钱不够」的普通中产家庭。",
  "它的著名之处在于极简:只保留三个比例,不要求记账、不要求开多个账户,一条线就能判断自己的支出结构健康与否。",
]

[[sections]]
heading = "核心逻辑"
paragraphs = [
  "税后收入切三份:五成给「必要」——房租水电、饮食、交通、保险这些不付就有后果的开销;三成给「想要」——外食、娱乐、购物这类砍掉也能活的弹性开销;两成给「储蓄」——先存后花,储蓄账户同时承担应急与长期积累。",
  "这个框架最有价值的部分是把「必要」和「想要」分开:多数人的赤字不是必要开销膨胀,而是想要的开销悄悄越界。比例表让越界一眼可见。",
  "在本产品中,储蓄桶兼作投资桶:应急金未达标期间,每月转入优先理解为补应急缺口;达标之后,同一笔钱自然转为长期积累,无需切换模式。",
]

[[sections]]
heading = "适用条件"
paragraphs = [
  "适合收入相对稳定、不想记账、希望用一个简单比例长期自查的人;也适合已经有一定储蓄、想从「记账流」切换到「比例流」的人。",
  "由于必要开销按比例而非实际金额扣划,它对「固定支出已经很高」的人同样能如实反映问题——必要桶之外的份额会被压薄,压力表露无遗。",
]

[[sections]]
heading = "局限性"
paragraphs = [
  "五成必要开销在很多高房价城市并不现实:如果房租一项就吃掉四成,这套比例会持续「报错」,需要先调整居住成本才能让框架成立。",
  "两成储蓄是一个「及格线」而非最优解:它既不因收入上升而自动加码,也不因临近退休而自动提高,比例恒定意味着它不响应人生阶段。",
  "它没有为应急金设独立通道:应急与长期投资混在同一个桶里,攒下的钱该不该动、动了算不算破功,框架本身不给答案,需要使用者自律。",
]
