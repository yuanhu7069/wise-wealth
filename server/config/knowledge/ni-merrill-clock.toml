# 知识库 · 不可落地专区(RULE-040:仅供理解,不建议照搬)
id = "ni-merrill-clock"
kind = "non_implementable"
title = "美林时钟:按经济周期轮动资产的海图"
summary = "复苏买股、过热买商品、滞胀持现金、衰退买债——逻辑优美,周期难测,事后看图完美,事前下注全靠猜。"

[[sections]]
heading = "它说什么"
paragraphs = [
  "美林时钟由美国投行研究团队于 2004 年前后提出,用「经济增长 × 通胀」两个维度把经济划成四个阶段:复苏期股票最好、过热期大宗商品最好、滞胀期现金为王、衰退期债券最好。它主张按周期位置轮动配置,让资产始终停在当下最强势的那一类。",
]

[[sections]]
heading = "为什么它流行"
paragraphs = [
  "它把晦涩的宏观经济学压缩成一张钟表图,给了一个「现在该买什么」的直观答案;对需要向客户解释配置逻辑的人来说,它是极好的沟通教具——这也是它传播广的原因。",
]

[[sections]]
heading = "为什么不建议照搬"
paragraphs = [
  "周期的「当前时刻」无法实时确认:你永远只能在事后指着图表说「哦,那是一季度进的衰退」。所有指标都是滞后或修正值,而轮动要求你当下就下注——图是事后画的,路是盲走的。",
  "它提出后不久就遭遇了表现最差的时期:2008 年金融危机的演化路径与钟表的经典顺序严重脱节,此后多个市场的实证研究对其有效性毁誉参半。发明它的机构自己也早已不再以此作为核心配置方法。",
  "个人投资者的信息与工具完全撑不起宏观择时:轮动需要高频、大额、跨资产的调整成本,而个人每月一次的定投节奏与之根本不匹配。结论:把它当宏观教学的地图,别当自己的导航。",
]
