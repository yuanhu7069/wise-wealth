# 知识库 · 理财百科(G 期 FEATURE-004)
id = "ec-rebalancing"
kind = "encyclopedia"
title = "再平衡"
summary = "把跑偏的资产比例拉回目标值:涨多了的卖一点,跌多了的补一点,纪律优先于预测。"

[[sections]]
heading = "是什么"
paragraphs = [
  "资产配置目标定好后(比如股债各半),市场涨跌会让实际比例漂移。再平衡就是定期或按阈值把比例调回目标:卖出涨多的、买入跌少的,恢复原始配置。",
]

[[sections]]
heading = "为什么重要"
paragraphs = [
  "再平衡的本质是低买高卖的纪律化:不预测市场,只对「偏离」做机械反应。它避免了两类常见错误——追着涨的加仓、砍掉跌的止损。",
  "频率不必高:常见的做法是每年一次,或某一类资产偏离目标超过五到十个百分点才动。再平衡越频繁,交易成本越高,而收益提升并不随之增加。",
]

[[sections]]
heading = "与本产品的关系"
paragraphs = [
  "本产品的模式在执行规则层已经内置了再平衡的触发口径(如偏离目标比例若干个百分点才调整),你不需要自己设计规则,只需要知道它在替你管纪律。",
]
